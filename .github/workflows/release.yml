name: Release desktop binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v1.0.2（工作流会用该标签的版本号打包）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "发布标签必须以 v 开头：$RELEASE_TAG" >&2; exit 1 ;;
          esac
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prepare and validate native resources
        run: |
          node scripts/prepare-media-resources.mjs win32 x64
          node scripts/validate-native-resources.mjs win32 x64

      - name: Build application
        run: npm run build

      - name: Package portable executable
        run: npx electron-builder --win portable --x64 --publish never

      - name: Audit packaged resources
        run: node scripts/audit-package.mjs release/win-unpacked win32 x64

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: app/release/*-win-x64-portable.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply release version
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "发布标签必须以 v 开头：$RELEASE_TAG" >&2; exit 1 ;;
          esac
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Prepare and validate native resources
        run: |
          node scripts/prepare-media-resources.mjs darwin ${{ matrix.arch }}
          node scripts/prepare-native-resources.mjs darwin ${{ matrix.arch }}
          node scripts/validate-native-resources.mjs darwin ${{ matrix.arch }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package unsigned DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify app bundle and DMG
        run: |
          set -euo pipefail
          APP_PATH="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find release -maxdepth 1 -type f -name "*-mac-${{ matrix.arch }}.dmg" -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          node scripts/audit-package.mjs "$APP_PATH" darwin ${{ matrix.arch }}
          node scripts/smoke-packaged.mjs "$APP_PATH" darwin ${{ matrix.arch }} 6
          node scripts/verify-macos-release.mjs "$DMG_PATH" ${{ matrix.arch }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: app/release/*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts and write checksums
        run: |
          set -euo pipefail
          ls -lh artifacts
          cd artifacts
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          AI创作工作台 ${RELEASE_TAG} 自动构建。

          ## 产物

          - Windows x64 便携版：AI创作工作台-${RELEASE_TAG#v}-win-x64-portable.exe
          - macOS Intel：AI创作工作台-${RELEASE_TAG#v}-mac-x64.dmg
          - macOS Apple Silicon：AI创作工作台-${RELEASE_TAG#v}-mac-arm64.dmg

          ## 验证

          - 类型检查、单元测试和原生资源审计在构建机通过
          - macOS 应用包完成启动冒烟测试并校验架构与资源哈希
          - 所有产物的 SHA-256 见 SHA256SUMS.txt

          ## 注意

          - macOS 包未签名、未公证，首次打开请右键选择“打开”，或在“系统设置 → 隐私与安全性”中允许。
          - 第三方站点的真实登录、生成和下载需要自有账号，不包含在自动验收中。
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "AI创作工作台 ${RELEASE_TAG}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --title "AI创作工作台 ${RELEASE_TAG}" --notes-file "$notes"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
